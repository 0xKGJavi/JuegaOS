---
defaultGroups:
  - users
  - audio
  - video
  - storage
  - wheel

sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
allowWeakPasswords: false

user:
  shell: /bin/bash
  forbidden_names: [root]
  home_permissions: "0700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-juegaos"
  forbidden_names: [localhost]
