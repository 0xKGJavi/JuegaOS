---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: juegaos
    module: packages
    config: packages.conf
  - id: juegaos-cleanup
    module: shellprocess
    config: shellprocess-juegaos-cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - removeuser
      - users
      - shellprocess@juegaos-cleanup
      - packages@juegaos
      - displaymanager
      - hwclock
      - services-systemd
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

prompt-install: true
disable-cancel-during-exec: true
quit-at-end: false
